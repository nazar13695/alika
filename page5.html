<!DOCTYPE html><html lang='uk'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no'><style>
* { box-sizing: border-box; } body { margin:0; height:100vh; color:white; font-family:Georgia,serif; display:flex; justify-content:center; align-items:center; padding:10px; overflow:hidden; position:relative; background: url('photo5.jpg') no-repeat center center/cover; }
.falling-element { position:absolute; animation:fall linear infinite; z-index:999; pointer-events:none; } @keyframes fall { 0% { transform:translateY(-20px) rotate(0deg) scale(0.8); opacity:0; } 10% { opacity:1; } 90% { opacity:1; } 100% { transform:translateY(102vh) rotate(360deg) scale(1.1); opacity:0; } }
.book { width:100%; height:94vh; padding:20px; border-radius:15px; border: 2px solid #df9cff; position:relative; z-index:10; background: linear-gradient(135deg, rgba(36, 5, 48, 0.85), rgba(10, 0, 13, 0.9)); box-shadow: 0 0 30px #df9cff; display: flex; flex-direction: column; justify-content: space-between; }
h1 { text-align: center; color: #df9cff; font-size: 28px; text-shadow: 0 0 12px #a020f0; margin: 5px 0; } .line { width: 90%; height: 1px; margin: 5px auto 15px; background: #df9cff; box-shadow: 0 0 15px #df9cff; }
.final-content { flex-grow: 1; padding: 15px; background: rgba(20, 0, 30, 0.6); border: 1.5px solid rgba(223,156,255,0.4); border-radius: 12px; overflow-y: auto; text-align: center; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; backdrop-filter: blur(3px); }
h2 { color: #ff69b4; text-shadow: 0 0 10px #ff1493; font-size: 22px; margin-bottom: 12px; }
.typewriter-text { color: #fbf0ff; font-size: 15px; line-height: 1.6; font-style: italic; white-space: pre-wrap; text-align: center; font-weight: bold; text-shadow: 1px 1px 2px #000; }
.nav-buttons { display:flex; justify-content:center; margin-top: 15px; min-height: 45px; } .btn { background:linear-gradient(135deg, #ff1493, #7b1fa2); color:white; border:none; padding:12px 30px; font-size:14px; font-weight:bold; border-radius:6px; text-decoration:none; text-align:center; box-shadow:0 0 12px #ff1493; width:65%; }
</style></head><body><div id='falling-container'></div><div class='book'><h1>Назар і Аліка</h1><div class='line'></div>
<div class='final-content'><h2>💞 Моє серце з тобою...</h2><div class='typewriter-text' id='typed-text'></div></div>
<div class='nav-buttons'><a href='page4.html' class='btn'>◀ Подивитись назад</a></div></div>
<script>const text = "Аліко, моя єдина і найкоханіша дівчинко...\n\nЯ хочу сказати тобі найважливіші слова, які тримаю глибоко в серці. Дякую тобі за те, що ти просто є в моєму світі. За кожну твою чарівну посмішку, від якої стає тепло навіть у похмурий день, за твій ніжний погляд і за кожну мить, яку ми проживаємо разом.\n\nТи перетворила моє життя на справжню, дивовижну казку. Я безмежно вдячний тобі за твоє тепло, безмежне розуміння, затишок та твою шалену підтримку в усьому.\n\nЯ хочу, щоб ти знала: що б не чекало на нас переважно попереду, які б дороги не лежали перед нами, я обіцяю завжди бути поруч. Я буду міцно тримати тебе за руку, підтримувати та оберігати твоє щастя щомиті.\n\nЯ шалено, всім серцем кохаю тебе, моя маленька! Дякую тобі за все, ти — моє все назавжди... ❤️";
let index = 0; function type() { if (index < text.length) { document.getElementById('typed-text').innerHTML += text.charAt(index); index++; setTimeout(type, 40); } } setTimeout(type, 600);
const symbols = ['❤️','🧸','✨','💖']; setInterval(() => { const c = document.getElementById('falling-container'); if (!c) return; const h = document.createElement('div'); h.classList.add('falling-element'); h.innerHTML = symbols[Math.floor(Math.random()*symbols.length)]; h.style.left = Math.random() * 100 + 'vw'; h.style.animationDuration = Math.random() * 2 + 3 + 's'; h.style.fontSize = '20px'; c.appendChild(h); setTimeout(() => { h.remove(); }, 5000); }, 300);</script></body></html>
