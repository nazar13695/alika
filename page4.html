<!DOCTYPE html><html lang='uk'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no'><style>
* { box-sizing: border-box; } body { margin:0; height:100vh; color:white; font-family:Georgia,serif; display:flex; justify-content:center; align-items:center; padding:10px; overflow:hidden; position:relative; background:radial-gradient(circle at 50% 0%, #7b1fa2 0%, transparent 45%), linear-gradient(135deg, #020003, #16001f, #020003); transition: background 1.5s ease; }
.falling-element { position:absolute; animation:fall linear infinite; z-index:999; pointer-events:none; } @keyframes fall { 0% { transform:translateY(-20px) rotate(0deg) scale(0.8); opacity:0; } 10% { opacity:1; } 90% { opacity:1; } 100% { transform:translateY(102vh) rotate(360deg) scale(1.1); opacity:0; } }
.book { width:100%; height:94vh; padding:15px; border-radius:15px; border:2px solid #a238ff; position:relative; z-index:10; background: linear-gradient(135deg, #1b0522, #070007); box-shadow: 0 0 20px #8a2be2; display: flex; flex-direction: column; justify-content: space-between; transition: all 1.5s ease; }
h1 { text-align:center; color:#df9cff; font-size:28px; text-shadow:0 0 8px #a020f0; margin:5px 0; } .line { width:90%; height:1px; margin:5px auto 10px; background:#a238ff; box-shadow:0 0 10px #a238ff; } .page-content { display:flex; flex-direction:column; gap:10px; flex-grow:1; overflow-y:auto; padding-bottom:60px; } .left-side, .right-side { padding:12px; background:rgba(50,5,65,.3); border:1px solid #68228a; border-radius:10px; position:relative; }
.neon-pulse-title { color: #df9cff; text-shadow: 0 0 5px #8a2be2; } h2 { color:#ce7dff; text-shadow:0 0 8px #8a2be2; font-size:18px; margin:0 0 5px 0; } p { color:#eadcf0; font-size:14px; line-height:1.5; margin:0; }
#love-block, .floating-catch-btn { display:none; }
.floating-catch-btn { position:fixed; z-index:9999; background:linear-gradient(135deg, #ff1493, #7b1fa2); color:white; border:none; padding:12px 20px; font-size:14px; font-weight:bold; border-radius:50px; cursor:pointer; box-shadow:0 0 15px #ff1493; transition: all 0.12s ease; touch-action: none; text-align:center; }
.final-content { flex-grow: 1; padding: 15px; background: rgba(20, 0, 30, 0.7); border: 1.5px solid rgba(223,156,255,0.4); border-radius: 12px; overflow-y: auto; text-align: center; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; backdrop-filter: blur(3px); }
.typewriter-text { color: #fbf0ff; font-size: 15px; line-height: 1.6; font-style: italic; white-space: pre-wrap; text-align: center; font-weight: bold; text-shadow: 1px 1px 2px #000; }
</style></head><body><div id='falling-container'></div>
<button id='catch-me' class='floating-catch-btn' onmouseover='runAway()' ontouchstart='runAway()' onclick='showLoveWords()'>Лови кохання! 💞</button>
<div class='book' id='main-book'><h1>Назар і Аліка</h1><div class='line'></div>
<div class='page-content' id='page-blocks'>
<div class='left-side' id='quiz-wrapper' style='width:100%;'>
<div id='quiz-box'><h2 class='neon-pulse-title'>🧩 Розгадай загадку</h2><p style='margin-bottom:10px;'>Вона зближує серця, дарує крила і гріє навіть у люті морози. Вона почалися між нами як міцна дружба, а тепер веде нас у спільне майбутнє.</p><p style='font-weight:bold; color:#df9cff; margin-bottom:15px;'>Який день став початком цього дива? Введи дату нашої любові:</p>
<div class='quiz-section'><input type='text' class='quiz-input' id='code-input' placeholder='ДД.ММ.РРРР'><button class='quiz-btn' onclick='checkCode()'>Відгадати 🔮</button><div class='error-msg' id='quiz-error'>Неправильна дата, спробуй ще раз! ❤️</div></div></div></div>
<div id='love-block' class='final-content'><h2 style='color:#ff69b4; text-shadow:0 0 10px #ff1493; font-size:22px;'>💞 Наша історія</h2><div class='typewriter-text' id='typed-text'></div></div>
</div></div>
<script>let fallingInterval; let isQuizSolved=false; 
const text = "Пам'ятаєш нашу спільну поїздку? Дорога, розмови, нові краєвиди та час, коли ми належили тільки один одному. Дякую тобі за цей неймовірний день, за твою посмішку в дорозі й за те, що кожна мить із тобою перетворюється на найкращу пригоду. Ці спогади гріють мене щомиті... 🌍✨\n\nАліко, моя єдина і найкоханіша дівчинко... Я хочу сказати тобі найважливіші слова, які тримаю глибоко в серці. Дякую тобі за те, що ти просто є в моєму світі. За кожну твою чарівну посмішку, від якої стає тепло навіть у похмурий день, за твій ніжний погляд і за все наше кохання.\n\nТи перетворила моє життя на справжню казку. Я безмежно вдячний тобі за твоє тепло, безмежне розуміння, затишок та твою шалену підтримку в усьому. Я обіцяю завжди бути поруч, міцно тримати тебе за руку, підтримувати та оберігати твоє щастя щомиті.\n\nЯ шалено, всім серцем кохаю тебе, моя маленька! Дякую тобі за все, ти — моє все назавжди...\n\nПОДИВИСЯ НАЗАД... ❤️";
function checkCode(){const input=document.getElementById('code-input').value.trim().replace(/\./g, ''); if(input==='14022026'){isQuizSolved=true; document.getElementById('quiz-wrapper').style.display='none'; startFalling('🎉',18,200);
const btn=document.getElementById('catch-me'); btn.style.display='block'; btn.style.top='50%'; btn.style.left='50%'; btn.style.transform='translate(-50%, -50%)';}else{document.getElementById('quiz-error').style.display='block';}}
function runAway(){ const btn=document.getElementById('catch-me'); const x=Math.random()*(window.innerWidth - btn.clientWidth - 40)+20; const y=Math.random()*(window.innerHeight - btn.clientHeight - 40)+20; btn.style.transform='none'; btn.style.left=x+'px'; btn.style.top=y+'px'; }
function showLoveWords(){ document.getElementById('catch-me').style.display='none'; document.body.style.background="url('photo5.jpg') no-repeat center center/cover"; document.getElementById('main-book').style.background="linear-gradient(135deg, rgba(36, 5, 48, 0.85), rgba(10, 0, 13, 0.9))"; document.getElementById('love-block').style.display='block'; startFalling('🧸',20,250); type(); }
let index = 0; function type() { if (index < text.length) { document.getElementById('typed-text').innerHTML += text.charAt(index); index++; setTimeout(type, 45); } }
function startFalling(sym,size,delay){clearInterval(fallingInterval); fallingInterval=setInterval(() => {const c=document.getElementById('falling-container'); if(!c)return; const h = document.createElement('div'); h.classList.add('falling-element'); h.innerHTML=sym; h.style.left=Math.random()*100+'vw'; h.style.animationDuration=Math.random()*2+3+'s'; h.style.fontSize=size+'px'; c.appendChild(h); setTimeout(() => {h.remove();},5000);},delay);} startFalling('❓',16,350);</script></body></html>
