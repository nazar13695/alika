<!DOCTYPE html><html lang='uk'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no'><style>
* { box-sizing: border-box; } body { margin:0; height:100vh; color:white; font-family:Georgia,serif; display:flex; justify-content:center; align-items:center; padding:10px; overflow:hidden; position:relative; background:radial-gradient(circle at 50% 0%, #7b1fa2 0%, transparent 45%), linear-gradient(135deg, #020003, #16001f, #020003); }
.falling-element { position:absolute; animation:fall linear infinite; z-index:999; pointer-events:none; } @keyframes fall { 0% { transform:translateY(-20px) rotate(0deg) scale(0.8); opacity:0; } 10% { opacity:1; } 90% { opacity:1; } 100% { transform:translateY(102vh) rotate(360deg) scale(1.1); opacity:0; } }
.book { width:100%; height:94vh; padding:15px; border-radius:15px; border:2px solid #a238ff; position:relative; z-index:10; background:linear-gradient(135deg, #1b0522, #070007); box-shadow:0 0 20px #8a2be2; display:flex; flex-direction:column; justify-content:space-between; }
h1 { text-align:center; color:#df9cff; font-size:28px; text-shadow:0 0 8px #a020f0; margin:5px 0; } .line { width:90%; height:1px; margin:5px auto 10px; background:#a238ff; box-shadow:0 0 10px #a238ff; } .page-content { display:flex; flex-direction:column; gap:10px; flex-grow:1; overflow-y:auto; padding-bottom:60px; }
.left-side, .right-side { padding:12px; background:rgba(50,5,65,.3); border:1px solid #68228a; border-radius:10px; position:relative; }
.animated-text { opacity:0; filter:blur(5px); transform:translateY(10px); animation:textReveal 0.8s cubic-bezier(0.11,0,0,1) forwards; margin:5px 0; } .animated-text:nth-child(1) { animation-delay:0.1s; } .animated-text:nth-child(2) { animation-delay:0.4s; } @keyframes textReveal { to { opacity:1; filter:blur(0); transform:translateY(0); } }
h2 { color:#ce7dff; text-shadow:0 0 8px #8a2be2; font-size:18px; margin:0 0 5px 0; } p { color:#eadcf0; font-size:14px; line-height:1.5; margin:0; }
.photo-container-single { height:260px; width:100%; overflow:hidden; border-radius:8px; border:1.5px solid #a238ff; box-shadow:0 0 15px rgba(162,56,255,.4); } .photo { width:100%; height:100%; object-fit:cover; }
.nav-buttons { display:flex; justify-content:center; position:absolute; bottom:15px; left:15px; right:15px; } .btn { background:linear-gradient(135deg, #a238ff, #7b1fa2); color:white; border:none; padding:10px 25px; font-size:14px; font-weight:bold; border-radius:6px; text-decoration:none; text-align:center; box-shadow:0 0 8px #a238ff; }
</style></head><body><div id='falling-container'></div><div class='book'><h1>Назар і Аліка</h1><div class='line'></div><div class='page-content'><div class='left-side'><h2>❤️ Наш початок</h2><p class='animated-text'>Ми познайомилися в компанії, почали багато проводити часу разом.</p><p class='animated-text'>Ми дружили дуже добре, і в один день наш початок любові почався. ❤️</p></div><div class='right-side'><div class='photo-container-single'><img class='photo' src='photo1.jpg' alt='Фото 1'></div></div></div><div class='nav-buttons'><a href='page2.html' class='btn'>Вперед ▶</a></div></div><script>setInterval(() => { const c = document.getElementById('falling-container'); if (!c) return; const h = document.createElement('div'); h.classList.add('falling-element'); h.innerHTML = '❤️'; h.style.left = Math.random() * 100 + 'vw'; h.style.animationDuration = Math.random() * 2 + 3 + 's'; c.appendChild(h); setTimeout(() => { h.remove(); }, 5000); }, 400);</script></body></html>
